prompts:
  intro: "This image is a multi-channel EEG waveform plot: time runs along the horizontal axis and each row is the signal from one electrode channel. "
  no-meta: "Do not describe the image format or define terminology."
  eval:
    # a label-only fine-tune (train.target: labels) is prompted without the *-rationale sentence and the no-meta line
    binary: "Based only on these waveforms, {task}. "
    binary-rationale: "In the text_rationale field, describe the specific evidence for your decision: which channel(s) support it, where along the time axis, and what the curve looks like there (shape, frequency, amplitude, symmetry). "
    tasks:
      TUAB: classify the brain activity as normal or abnormal
      TUEP: classify the recording as epileptic or non-epileptic
    multilabel: "From these {kind} - {listed} - select every one present, based only on the waveforms. "
    multilabel-rationale: "In the text_rationale field, for each category you mark as present, describe the specific evidence in the waveform: which channel(s) it appears on, where along the time axis, and what the curve looks like there (shape, frequency, amplitude). "
    multilabel-suffix: " Set a category's boolean to true only when it is present."
    kinds:
      TUAR: artifact categories
      TUEV: event categories
      TUSL: labels
      TUSZ: seizure/background categories
  rationale:
    label-clauses:
      TUAB: "This recording is labeled {labels}."
      TUEP: "This recording is from a person labeled {labels}."
      TUAR: "This recording contains these artifacts: {labels}."
      TUEV: "This recording contains these events: {labels}."
      TUSL: "This recording contains these events: {labels}."
      TUSZ: "This recording contains these seizure labels: {labels}."
    grounded: "Justify this labeling using only visible EEG features. For each finding, give the specific evidence: which channel(s) it appears on, where along the time axis, and what the curve looks like there (shape, frequency, amplitude). State every label explicitly. Write a focused 3-5 sentence mini-report; do not describe the image format, define terminology, repeat yourself, or add unsupported findings."

train:
  # names this round of fine-tunes: checkpoints/<key>/<DS>-<experiment>, model <key>-sft-<DS>-<experiment>, wandb group
  # <experiment>, results in experiments/<experiment>.csv. A new round gets a new name, never a reused one
  # (knowledge/experiments.md). Round 1 (pooled, 2026-09-23) is archived under archive/round1-pooled/
  experiment: labels
  target: labels  # labels: booleans-only JSON (sft_labels_*.jsonl); rationale: rationale then booleans (sft_*.jsonl)
  rationale-first: true
  wandb:
    entity: l3jovano-krembil-research-institute
    project: eeg-vlm-finetune
  time: '24:00:00'
  ram: 64G
  gpus: 1
  cpus: 8
  eval:
    time: '24:00:00'
    ram: 64G
    gpus: 1
    cpus: 8
    large:
      time: '48:00:00'
      ram: 128G
      gpus: 2
  val:
    fraction: 0.05
    min-patients: 10
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    vision: true
    vision-lr-scale: 0.5
  training:
    epochs: 2
    batch-size: 1
    gradient-accumulation: 8
    learning-rate: 0.0002
    warmup-ratio: 0.03
    lr-scheduler: cosine
    weight-decay: 0.0
    eval-steps: 100
    save-steps: 100
    save-total-limit: 2
    logging-steps: 10
