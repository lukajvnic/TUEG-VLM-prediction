  eval-retries: 1
  parallel-requests: 4
  test-sample:
    abundant-class-recordings: 200
    windows-per-signature: 3
    background-per-recording: 2
    binary-windows-per-recording: 4
    recordings-per-patient: 4
  train-sample:
    recordings-per-patient: 8
    background-per-recording: 1
    majority-ratio: 1.5
    reject-bad-rationales: true
    exclude-cross-dataset-test-patients: true   # 117 patients are train in one corpus and test in another; also
                                                # drops train windows byte-identical to a test image in any corpus
