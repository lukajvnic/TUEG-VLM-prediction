# Rationale-agreement stage (eval/run-judge.py -> eval/scripts/judge.py). Read
# live from this file rather than from a run's frozen copy: the stage runs after
# and independently of the sweep, so its settings are not pinned at submission.
judge:
  # Used text-only: it reads two rationales, never the image.
  #
  # Picked from the models already staged in $OLLAMA_MODELS -- the eval sweep ran
  # against all 35 in `models` below, so all 35 are present, and compute nodes
  # have no route to the Ollama registry. `run-judge.py check` verifies staging
  # before anything is queued.
  #
  # Why this one, of those 35:
  #  - NOT gemma3:12b, and not the gemma family at all (8 gemma + 2 medgemma).
  #    gemma3:12b writes every reference rationale, so a gemma judge would be
  #    grading prose from its own lineage.
  #  - NOT qwen2.5vl (3 models): rejected for the single-token repetition loop,
  #    ollama/ollama#10767 -- same reason it is not the teacher.
  #  - NOT a -thinking model: token cost per pair must be predictable across
  #    ~520k pairs.
  #  - Smallest capable family (2 entries), so only mistral-small3.1:24b shares
  #    its lineage; and 24B follows the two-boolean schema reliably where an 8B
  #    does not.
  #
  # CAVEAT: it IS one of the 35 benchmarked models, so its own row in the
  # agreement table grades its own prose. See knowledge/known-issues.md.
  model: "mistral-small3.2:24b"

  # Mirrors this model's own roster entry below, which is known to schedule.
  # ~14 GB of Q4 weights x 1.15 is ~16 GB before KV, so it does NOT fit the
  # 19.6 GiB a MIG 3g.20gb slice reports -- needs a full A100. Walltime stays at
  # 12h despite the roster's 24h: text-only pairs cost far less than a ~4033
  # token image, and judging resumes per pair.
  time: "12:00:00"
  ram: "32G"
  gpus: 1
  parallel-requests: 8
  array-concurrency: 12

  # Two rationales + the rubric is ~700-1200 tokens; 4096 covers the tail with
  # room for the verdict. num-predict is deliberately tight: the `reason` field
  # is most of the decode cost at ~520k pairs, so it is capped at 15 words.
  num-ctx: 4096
  num-predict: 96
  # Longest thinking-model rationales run well past this; truncating keeps one
  # verbose model from blowing the context budget for every pair it produced.
  max-rationale-chars: 3000

  # Only transport errors are worth retrying -- a schema-validation failure is
  # deterministic. Same reasoning as eval.py's TRANSIENT_ERRORS.
  judge-retries: 1

  # Fraction of pairs additionally judged against a DIFFERENT recording's
  # reference. Their agreement rate is the judge's false-agreement floor: a
  # model whose real agreement rate does not clear its own control rate is
  # writing EEG boilerplate that would match any plot, not reading this one.
  # Same role the constant-predictor baseline plays in summarize.py.
  control-fraction: 0.05
settings:
  array-concurrency: 78
  eval-retries: 1
  limit: -1
  parallel-requests: 4
  resume-from:
  # Stage-1 screening: images per dataset for the probe run (blank = full run).
  # Promote a model to the full run only when its recording-level macro-F1 CI
  # clears the constant-predictor baseline that summarize.py prints.
  probe-images:
  test-sample:
    abundant-class-recordings: 200
    windows-per-signature: 3
    background-per-recording: 2
    binary-windows-per-recording: 4
    recordings-per-patient: 4
  model-kwargs:
    base_url: http://localhost:11434
    temperature: 0
  structured-output:
    method: json_schema
datasets:
  TUEP:
    prompt: "This image is a multi-channel EEG waveform plot: time runs along the horizontal axis and each row is the signal from one electrode channel. Based only on these waveforms, classify the recording as epileptic or non-epileptic. In the text_rationale field, describe the specific evidence for your decision: which channel(s) support it, where along the time axis, and what the curve looks like there (shape, frequency, amplitude, symmetry). Do not describe the image format or define terminology."
  TUAB:
    prompt: "This image is a multi-channel EEG waveform plot: time runs along the horizontal axis and each row is the signal from one electrode channel. Based only on these waveforms, classify the brain activity as normal or abnormal. In the text_rationale field, describe the specific evidence for your decision: which channel(s) support it, where along the time axis, and what the curve looks like there (shape, frequency, amplitude, symmetry). Do not describe the image format or define terminology."
  TUEV:
    prompt: "This image is a multi-channel EEG waveform plot: time runs along the horizontal axis and each row is the signal from one electrode channel. From these event categories - ARTF, BCKG, EYEM, GPED, PLED, SPSW - select every one present, based only on the waveforms. In the text_rationale field, for each category you mark as present, describe the specific evidence in the waveform: which channel(s) it appears on, where along the time axis, and what the curve looks like there (shape, frequency, amplitude). Do not describe the image format or define terminology. Set a category's boolean to true only when it is present."
  TUAR:
    prompt: "This image is a multi-channel EEG waveform plot: time runs along the horizontal axis and each row is the signal from one electrode channel. From these artifact categories - BCKG, CHEW, ELEC, ELPP, EYEM, MUSC, SHIV - select every one present, based only on the waveforms. In the text_rationale field, for each category you mark as present, describe the specific evidence in the waveform: which channel(s) it appears on, where along the time axis, and what the curve looks like there (shape, frequency, amplitude). Do not describe the image format or define terminology. Set a category's boolean to true only when it is present."
  TUSZ:
    prompt: "This image is a multi-channel EEG waveform plot: time runs along the horizontal axis and each row is the signal from one electrode channel. From these seizure/background categories - ABSZ, BCKG, CPSZ, FNSZ, GNSZ, MYSZ, SPSZ, TCSZ, TNSZ - select every one present, based only on the waveforms. In the text_rationale field, for each category you mark as present, describe the specific evidence in the waveform: which channel(s) it appears on, where along the time axis, and what the curve looks like there (shape, frequency, amplitude). Do not describe the image format or define terminology. Set a category's boolean to true only when it is present."
  TUSL:
    prompt: "This image is a multi-channel EEG waveform plot: time runs along the horizontal axis and each row is the signal from one electrode channel. From these labels - BCKG, SEIZ, SLOW - select every one present, based only on the waveforms. In the text_rationale field, for each category you mark as present, describe the specific evidence in the waveform: which channel(s) it appears on, where along the time axis, and what the curve looks like there (shape, frequency, amplitude). Do not describe the image format or define terminology. Set a label's boolean to true only when it is present."
