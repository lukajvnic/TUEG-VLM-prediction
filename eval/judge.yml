# Config for the rationale-agreement stage (eval/agreement.py -> eval/scripts/judge.py).
#
# Deliberately NOT in config.yml: create-retry-config.py rebuilds that file from
# config-base.yml and renders only `settings`, `datasets` and `models`, so any
# other top-level key there is silently dropped on the first retry. The judge
# stage also runs after and independently of the sweep, so it has no business
# being frozen into a run's config copy.

judge:
  # Text-only, so no vision tower and no image tokens: it reads two rationales.
  # Chosen for being (a) not the gemma3:12b teacher that writes the reference
  # rationales and (b) not one of the 35 benchmarked models, so it never grades
  # its own prose. Non-thinking, so token cost per pair is predictable -- a
  # reasoning model would make walltime a function of how much it decides to
  # think, which is what makes qwen3-vl:8b-thinking the eval sweep's long pole.
  model: "qwen2.5:14b-instruct"

  # ~9 GB of Q4 weights x 1.15 + KV for 4096 x 8 in flight is ~12 GB, so this
  # fits a 20 GB MIG slice with headroom. ESTIMATE, not measured -- if Ollama
  # logs CPU offload, drop parallel-requests to 4 or move to gpus: 1.
  time: "12:00:00"
  ram: "24G"
  gpus: "a100_3g.20gb:1"
  parallel-requests: 8
  array-concurrency: 12

  # Two rationales + the rubric is ~700-1200 tokens; 4096 covers the tail with
  # room for the verdict. num-predict is deliberately tight: the `reason` field
  # is most of the decode cost at ~520k pairs, so it is capped at 15 words.
  num-ctx: 4096
  num-predict: 96
  # Longest thinking-model rationales run well past this; truncating keeps one
  # verbose model from blowing the context budget for every pair it produced.
  max-rationale-chars: 3000

  # Only transport errors are worth retrying -- a schema-validation failure is
  # deterministic. Same reasoning as eval.py's TRANSIENT_ERRORS.
  judge-retries: 1

  # Fraction of pairs additionally judged against a DIFFERENT recording's
  # reference. Their agreement rate is the judge's false-agreement floor: a
  # model whose real agreement rate does not clear its own control rate is
  # writing EEG boilerplate that would match any plot, not reading this one.
  # Same role the constant-predictor baseline plays in score.py.
  control-fraction: 0.05
