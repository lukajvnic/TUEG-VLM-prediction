settings:
  array-concurrency: 49
  eval-retries: 1
  limit: -1
  model-kwargs:
    base_url: http://localhost:11434
    temperature: 0
  structured-output:
    method: json_schema
datasets:
  TUEP:
    prompt: "Classify these EEG spectrograms as either epileptic or non-epileptic. Provide a text rationale explaining your decision. You must return only the requested structured JSON object. Do not include markdown, code fences, chain-of-thought, hidden reasoning, XML tags, or any text outside the JSON object. Use boolean values only for classification fields."
  TUAB:
    prompt: "Classify these EEG spectrograms as belonging to either a normal or abnormal brain. Provide a text rationale explaining your decision. You must return only the requested structured JSON object. Do not include markdown, code fences, chain-of-thought, hidden reasoning, XML tags, or any text outside the JSON object. Use boolean values only for classification fields."
  TUEV:
    prompt: "Select all of the following event categories that appear in the EEG spectrograms: ARTF, BCKG, EYEM, GPED, PLED, or SPSW. Provide a text rationale explaining your decision. You must return only the requested structured JSON object. Do not include markdown, code fences, chain-of-thought, hidden reasoning, XML tags, or any text outside the JSON object. Use boolean values only for category fields."
  TUAR:
    prompt: "Select all of the following artifact categories that appear in the EEG spectrograms: BCKG, CHEW, ELEC, ELPP, EYEM, MUSC, or SHIV. Provide a text rationale explaining your decision. You must return only the requested structured JSON object. Do not include markdown, code fences, chain-of-thought, hidden reasoning, XML tags, or any text outside the JSON object. Use boolean values only for category fields."
  TUSZ:
    prompt: "Select all of the following seizure/background categories that appear in the EEG spectrograms: ABSZ, BCKG, CPSZ, FNSZ, GNSZ, MYSZ, SPSZ, TCSZ, or TNSZ. Provide a text rationale explaining your decision. You must return only the requested structured JSON object. Do not include markdown, code fences, chain-of-thought, hidden reasoning, XML tags, or any text outside the JSON object. Use boolean values only for category fields."
  TUSL:
    prompt: "Select all of the following labels that appear in the EEG spectrograms: BCKG, SEIZ, or SLOW. Provide a text rationale explaining your decision. You must return only the requested structured JSON object. Do not include markdown, code fences, chain-of-thought, hidden reasoning, XML tags, or any text outside the JSON object. Use boolean values only for label fields."
